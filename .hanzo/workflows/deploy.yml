name: deploy

# hanzo.agency is a SITE, not an App: a static export with no compute. It ships on the
# Sites plane. Not GitHub Pages, not Cloudflare Pages, and not an image — baking
# files that never execute into a container so a Go binary can serve them means an
# image, a push, a tag pinned in a CR and running pods, all to hand back bytes.
#
#   build -> dist
#     -> site
#
# The publish mechanics are NOT here. They are bin/site in hanzoai/ci,
# reached through its action, and every static surface in the fleet calls that one
# script — ensure-project, enqueue, presigned per-file upload, complete. A
# contract transcribed per repo is a contract that drifts, and this file used to
# carry its own copy of every call. It also SELF-PROVISIONS: the project is
# created idempotently before the enqueue, so committing this file is enough to
# stand the site up.
#
# The deploy key is in KMS and the action reads it there, so this file names no
# token — only the KMS client identity that opens it. It used to pass
# secrets.HANZO_DEPLOY_TOKEN, a forge org secret holding a key that had stopped
# resolving, and a secret nobody can read back is a secret nobody can tell is
# dead. Both credentials are set ON THE FORGE: this file lives under
# .hanzo/workflows/, which only git.hanzo.ai reads, so GitHub's secret store is
# not in this path at all.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  site:
    # NOT ubuntu-latest. This file lives in .hanzo/workflows, which GitHub never
    # reads — git.hanzo.ai is the only thing that can run it, and its fleet
    # advertises hanzo-build-linux-amd64. An unmatched label is not an error here,
    # it is silence: the job queues until the 24h timeout and nothing says so.
    runs-on: hanzo-build-linux-amd64
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: build the static export
        env:
          VITE_PUBLISHABLE_KEY: ${{ secrets.PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail
          # pnpm-lock.yaml is lockfileVersion 9.0 and package.json pins
          # pnpm@9.15.4; pin the same major so CI and the lockfile cannot resolve
          # different trees.
          corepack enable && corepack prepare pnpm@9.15.4 --activate
          pnpm install --frozen-lockfile
          pnpm build
          test -s dist/index.html || { echo "::error::vite build produced no dist/index.html"; exit 1; }
          # 404.html IS index.html here, and only because this is a client-routed
          # SPA: every route below / is resolved by react-router in the browser and
          # has no file of its own, so a miss must still boot the app. A real
          # per-route export must NEVER do this — it makes a broken link answer 404
          # while rendering the front page.
          cp dist/index.html dist/404.html
          echo "exported $(find dist -type f | wc -l) files"

          # Assert on the BYTES THAT SHIP, because everything upstream of here can
          # look correct while the export carries no key. That is not
          # hypothetical: VITE_PUBLISHABLE_KEY came from an unset secret, Vite
          # substituted the empty string, and every build published a bundle that
          # posts anonymously and is refused at the door — green, silent, dark.
          key=$(grep -rhoE 'pk-[A-Za-z0-9_-]{16,}' dist/assets | head -1 || true)
          [ -n "$key" ] || {
            echo "::error::no pk- publishable key in dist/assets — this bundle would 401 every anonymous event; refusing to publish"
            exit 1
          }
          # Shape is not liveness. A key can be perfectly formed and name a
          # deleted project, which is how three other hosts went dark for weeks
          # while their builds stayed green. An empty batch is a no-op the door
          # still authenticates: 200 live, 403 naming no project, 401 unreadable.
          # Fail closed on an answer, warn on none — an unreachable door is a fact
          # about the network, not about the key.
          code=$(curl -s -o /tmp/door.json -w '%{http_code}' --max-time 20 \
            -X POST "https://api.hanzo.ai/v1/event?ingest_key=$key" \
            -H 'content-type: application/json' -d '{"batch":[]}' || echo 000)
          case "$code" in
            200) echo "the publishable key in this bundle resolves at the ingest door (200)" ;;
            000) echo "::warning::could not reach the ingest door; proceeding (network, not the key)" ;;
            *)   echo "::error::the key in this bundle does not resolve: the door answered $code $(cat /tmp/door.json 2>/dev/null). Publishing would ship a site that loses every event."; exit 1 ;;
          esac

      # ONE credential. The 202 carries a prefix-scoped, 30-minute presigned POST
      # grant, so nothing here holds a bucket key. Do NOT add SITES_S3_* — that is
      # the standing shared-bucket credential the grant replaced, and it could
      # overwrite every other org's site.
      - name: Publish to the Sites plane
        uses: https://git.hanzo.ai/hanzoai/ci/.github/actions/site@v1
        with:
          slug: agency
          dir: dist
        env:
          KMS_CLIENT_ID: ${{ secrets.KMS_CLIENT_ID }}
          KMS_CLIENT_SECRET: ${{ secrets.KMS_CLIENT_SECRET }}
