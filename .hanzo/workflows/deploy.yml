name: deploy

# hanzo.agency is a SITE, not an App: a static export with no compute. It ships on the
# Sites plane. Not GitHub Pages, not Cloudflare Pages, and not an image — baking
# files that never execute into a container so a Go binary can serve them means an
# image, a push, a tag pinned in a CR and running pods, all to hand back bytes.
#
#   build -> dist
#     -> POST /v1/projects/agency/deploy {"source":"git"}   202 + an upload grant
#     -> POST each file under the grant                      bytes skip the API
#     -> POST .../deployments/<id>/complete {status, keys}
#
# The bytes never pass through the API: BodyLimit is 16 MiB, so an artifact POST
# of a real export is refused by fasthttp before any handler runs — and it fails
# as an opaque 400 that reads like a malformed payload rather than a size cap.
#
# THIS REPO HOLDS NO S3 CREDENTIAL, and should never hold one again. The
# SITES_S3_* keys this flow used to need were the hanzo-sites bucket's own
# long-lived credentials, and that bucket holds EVERY org's site separated only by
# key prefix — so a copy here was write access to everyone's site, forever, in as
# many places as there were repos. The 202 now carries a presigned POST policy
# confined to THIS site's prefix and expiring in 30 minutes.
#
# The one secret is HANZO_DEPLOY_TOKEN, which identifies us rather than granting
# storage. It is set ON THE FORGE: this file lives under .hanzo/workflows/, which
# only git.hanzo.ai reads, so GitHub's secret store is not in this path at all.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  site:
    # NOT ubuntu-latest. This file lives in .hanzo/workflows, which GitHub never
    # reads — git.hanzo.ai is the only thing that can run it, and its fleet
    # advertises hanzo-build-linux-amd64. An unmatched label is not an error here,
    # it is silence: the job queues until the 24h timeout and nothing says so.
    runs-on: hanzo-build-linux-amd64
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: build the static export
        env:
          VITE_EVENT_INGEST_KEY: ${{ secrets.EVENT_INGEST_KEY }}
        run: |
          set -euo pipefail
          # pnpm-lock.yaml is lockfileVersion 9.0 and package.json pins
          # pnpm@9.15.4; pin the same major so CI and the lockfile cannot resolve
          # different trees.
          corepack enable && corepack prepare pnpm@9.15.4 --activate
          pnpm install --frozen-lockfile
          pnpm build
          test -s dist/index.html || { echo "::error::vite build produced no dist/index.html"; exit 1; }
          # 404.html IS index.html here, and only because this is a client-routed
          # SPA: every route below / is resolved by react-router in the browser and
          # has no file of its own, so a miss must still boot the app. A real
          # per-route export must NEVER do this — it makes a broken link answer 404
          # while rendering the front page.
          cp dist/index.html dist/404.html
          echo "exported $(find dist -type f | wc -l) files"

      - name: enqueue the deployment
        id: enqueue
        env:
          DEPLOY_TOKEN: ${{ secrets.HANZO_DEPLOY_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${DEPLOY_TOKEN:-}" ]; then
            echo "::error::HANZO_DEPLOY_TOKEN is unset. Set it on the forge (git.hanzo.ai), which is what reads .hanzo/workflows — not on GitHub."
            exit 1
          fi
          CODE=$(curl -sS -o /tmp/enq.json -w '%{http_code}' \
            -X POST "https://api.hanzo.ai/v1/projects/agency/deploy" \
            -H "Authorization: Bearer ${DEPLOY_TOKEN}" \
            -H 'Content-Type: application/json' \
            -d "{\"source\":\"git\",\"commit\":\"${GITHUB_SHA}\",\"branch\":\"main\"}")
          # 202 Accepted is the success code here — the deployment is queued, not live.
          if [ "$CODE" != "202" ]; then
            echo "::error::enqueue returned HTTP $CODE — does project 'agency' exist?"
            head -c 600 /tmp/enq.json; exit 1
          fi
          # prefix comes FROM cloud. Never hardcode it: it is sitePrefix(org, slug)
          # server-side, so a local guess drifts the moment the org or slug changes
          # and the upload would land bytes nobody serves.
          echo "id=$(jq -r .id /tmp/enq.json)"         >> "$GITHUB_OUTPUT"
          echo "prefix=$(jq -r .prefix /tmp/enq.json)" >> "$GITHUB_OUTPUT"
          # The write grant rides the 202 and is what replaces the bucket keys. It
          # is a credential: keep it on one line, out of the log, and masked so a
          # later `set -x` or an error dump cannot spill the signature.
          GRANT=$(jq -c '.upload // empty' /tmp/enq.json)
          echo "::add-mask::$(jq -r '.fields.policy // empty' <<<"${GRANT:-{\}}")"
          echo "::add-mask::$(jq -r '.fields["x-amz-signature"] // empty' <<<"${GRANT:-{\}}")"
          echo "grant=${GRANT}" >> "$GITHUB_OUTPUT"
          # Everything logged here is non-secret: ids, the prefix, and when the
          # grant dies.
          jq -c '{id,version,status,prefix,grantExpires:(.upload.expiresAt // null)}' /tmp/enq.json

      # UPLOAD WITH THE GRANT, NOT A BUCKET CREDENTIAL. The policy is confined to
      # this site's prefix and S3 enforces that itself, so even a bug here cannot
      # write outside it. The signed fields are signed as a SET — they go on every
      # request verbatim, and `key` is the only thing that varies.
      - name: upload the export under the grant
        id: sync
        env:
          GRANT: ${{ steps.enqueue.outputs.grant }}
          PREFIX: ${{ steps.enqueue.outputs.prefix }}
        run: |
          set -euo pipefail
          if [ -z "${GRANT:-}" ] || [ "$GRANT" = "null" ]; then
            echo "::error::the deploy response carried no upload grant — cloud could not presign (S3_ADMIN_*/S3_PUBLIC_ENDPOINT unset server-side?)"
            exit 1
          fi
          # CNAME is a GitHub Pages artifact. It means nothing to S3 and would ship
          # a stale hostname claim into the bucket, so it does not travel.
          rm -f dist/CNAME

          URL=$(jq -r '.url' <<<"$GRANT")

          # The signed fields go on EVERY request unchanged, so write them once as
          # a curl config and -K it. A config file (rather than a bash array) is
          # what lets the parallel workers below share them without re-deriving
          # anything: curl reads it per invocation, and it never lands on a command
          # line where `ps` could read the signature.
          umask 077
          jq -r '.fields | to_entries[] | "form = \"\(.key)=\(.value)\""' <<<"$GRANT" > /tmp/grant.conf

          cd dist
          find . -type f -printf '%P\n' | sort > /tmp/manifest.txt
          COUNT=$(wc -l < /tmp/manifest.txt | tr -d ' ')
          test "$COUNT" -gt 0 || { echo "::error::export produced no files"; exit 1; }

          # One POST per object, 16 in flight. Sequential curls over a few thousand
          # files is the difference between a minute and half an hour.
          export URL PREFIX
          xargs -a /tmp/manifest.txt -P 16 -I{} sh -c '
            code=$(curl -sS -o /dev/null -w "%{http_code}" -X POST "$URL" \
              -K /tmp/grant.conf -F "key=$PREFIX/$1" -F "file=@$1")
            case "$code" in 2*) exit 0 ;; esac
            echo "::error::upload $1 -> HTTP $code" >&2
            exit 1
          ' _ {}
          cd - >/dev/null

          echo "files=${COUNT}" >> "$GITHUB_OUTPUT"
          echo "bytes=$(du -sk dist | awk '{print $1*1024}')" >> "$GITHUB_OUTPUT"
          echo "uploaded ${COUNT} objects under ${PREFIX}/"

      - name: flip it live
        env:
          DEPLOY_TOKEN: ${{ secrets.HANZO_DEPLOY_TOKEN }}
          DEP: ${{ steps.enqueue.outputs.id }}
          FILES: ${{ steps.sync.outputs.files }}
          BYTES: ${{ steps.sync.outputs.bytes }}
        run: |
          set -euo pipefail
          # The manifest is what replaces `aws s3 sync --delete`. The grant permits
          # writes only, so CI cannot remove a file; cloud reconciles the prefix
          # against this list and deletes whatever is no longer in it. Without it a
          # deleted page would keep serving forever.
          jq -R -s -c 'split("\n") | map(select(length > 0))' /tmp/manifest.txt > /tmp/keys.json
          jq -n --arg c "${GITHUB_SHA}" --argjson f "${FILES}" --argjson b "${BYTES}" \
                --slurpfile k /tmp/keys.json \
                '{status:"live", commit:$c, files:$f, bytes:$b, keys:$k[0]}' > /tmp/complete.json
          CODE=$(curl -sS -o /tmp/done.json -w '%{http_code}' \
            -X POST "https://api.hanzo.ai/v1/projects/agency/deployments/${DEP}/complete" \
            -H "Authorization: Bearer ${DEPLOY_TOKEN}" \
            -H 'Content-Type: application/json' \
            --data-binary @/tmp/complete.json)
          if [ "$CODE" != "200" ]; then
            echo "::error::complete returned HTTP $CODE"; head -c 600 /tmp/done.json; exit 1
          fi
          jq -c '{status,liveUrl,version,files,bytes}' /tmp/done.json

      # A build that dies after the enqueue would leave the deployment "queued"
      # and the project stuck "building" forever. Report the failure so cloud
      # records an honest terminal state instead of a lie by omission.
      - name: report a failed build
        if: failure() && steps.enqueue.outputs.id != ''
        env:
          DEPLOY_TOKEN: ${{ secrets.HANZO_DEPLOY_TOKEN }}
          DEP: ${{ steps.enqueue.outputs.id }}
        run: |
          curl -sS -X POST "https://api.hanzo.ai/v1/projects/agency/deployments/${DEP}/complete" \
            -H "Authorization: Bearer ${DEPLOY_TOKEN}" -H 'Content-Type: application/json' \
            -d '{"status":"error","message":"CI build or upload failed"}' >/dev/null || true
          echo "marked deployment ${DEP} as error"
